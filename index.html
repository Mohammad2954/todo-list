<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./style/feacher.css">
    <link rel="stylesheet" href="./vendor/all.min.css">

</head>
<body >
    
    
    <!-- add header -->
     <header class="py-8 border-b-2  left-0 right-0 px-5 sm:px-20 mr-40">
        <div class=" flex items-center justify-center w-full "> 
            <h2 class="font-serif text-2xl sm:text-3xl text-orange-900 font-bold w-full text-left sm:text-center">Todo List</h2>
        </div>
     </header>
    <!-- add header -->
     
    <main class="m-auto  mt-12 absolute items-center justify-center flex-col border border-amber-700  lg:max-w-5xl md:max-w-3xl  sm:max-w-xl p-1 rounded-lg right-42 left-2" >
        <div id="add-todo__icon" class="w-6"><i class="fas fa-add cursor-pointer text-green-600 mb-3" ></i></div>
        <div  class=" mx-1 "id="content-todo">
         
            
        </div>

    </main>
  
    <!-- rigth bar -->
     <section class=" rigthbar fixed right-0 w-40 top-0 h-full  border-l-2 " >
       
        <div class="flex items-center justify-between px-4 mt-5 text-amber-950">
        <span class="text-lg font-serif">دسته بندی</span>    
        <div id="add-category__icon"><i class="fas fa-add cursor-pointer text-green-600"></i></div>
        </div>
        <div class="px-4 mt-5 ">
            <ul id="list-category">

            </ul>
        </div>
     </section>
    <!-- rigth bar -->

     <!-- add category -->
      <div id="category-info" class=" hidden fixed w-80 left-0 right-0 sm:w-md border border-orange-300  m-auto rounded-md mt-24 shadow-lg bg-orange-300">
        <div class="p-4 relative flex flex-col gap-2">
            <button id="cetegory-close" class="absolute left-4 cursor-pointer ">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 text-red-700">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </button>
            <h3 class="text-lg  text-orange-900 font-bold font-serif mt-6"> دسته بندی :</h3>
            <input class="w-full pr-3 border  h-8 outline-0 mr-2 rounded-sm bg-[#915501]" type="text" id="value-category" placeholder="متن دسته بندی را وارد کنید">
            <div class="flex items-center justify-between mt-2">
                <div class="color-bar flex gap-1 items-center">
                 </div>
                <div class="flex items-center gap-2">
                    <button id="creat-category" class="border border-green-600 bg-green-600 text-white rounded-sm text-sm font-bold font-serif cursor-pointer px-2 py-1">ایجاد</button>
                    <button id="close-modal__category">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-red-700 cursor-pointer">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
     <!-- add category -->

    <!-- add todo -->
    <div class="hidden transition duration-300 ease-in fixed w-80 left-0 right-0 sm:w-md border border-orange-300  m-auto rounded-md mt-24 shadow-lg " id="add-todo">
        <div class="p-4 relative flex flex-col bg-orange-300 gap-2 rounded-md">
            <button class="absolute left-4 cursor-pointer " id="close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 text-red-700">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </button>
            <h3 class="text-lg  text-orange-900 font-bold font-serif mt-6"> عنوان :</h3>
            <input  class="w-full pr-3 border  h-8 outline-0 mr-2 rounded-sm bg-[#915501]"  type="text" id="value-todo" placeholder="متن تودو را وارد کنید">
            <div class="flex items-center gap-2 mt-1">
                <input type="checkbox" id="imported-todo">
                <span class="text-sm font-serif">دارای اولویت</span>
            </div>
            <div class="flex items-center justify-between mt-2">
                <div class="color-bar flex gap-1 items-center">
                </div>
                <div class="flex items-center gap-2">
                    <button class="border border-green-600 bg-green-600 text-white rounded-sm text-sm font-bold font-serif cursor-pointer px-2 py-1" id="creat-todo">ایجاد</button>
                    <button id='closetodo' class="text-red-700 border border-red-700 cursor-pointer rounded-sm text-sm font-bold font-serif px-2 py-1">
                    انصراف
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- add todo -->

    <!-- tost -->
     <div id="tost-box" class="px-2 fixed left-4 top-4  h-16 flex items-center justify-center bg-orange-200 rounded-lg shadow-lg tost opacity-0 -translate-y-4 pointer-events-none transition-all duration-300 ease-out z-50">
    <!-- محتوا با JS اضافه می‌شود -->
     </div>
    <!-- tost -->
    <script src="./script/app.js"></script>
<script src="./vendor/all.min.js"></script>
</body>
</html>
